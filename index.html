<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#003599" />
    <title>DC Department Portal | Asaba HQ</title>

    <meta
      name="description"
      content="DC Department Portal for managing members, units, attendance, contributions, reports, and department activities."
    />
    <meta
      name="keywords"
      content="Dominion City, DC Department Portal, church department, members, attendance, contributions, units, asaba, delta"
    />
    <meta name="author" content="Dominion City Asaba HQ Media Department" />

    <meta name="robots" content="noindex, nofollow" />

    <!-- Apple/iOS home-screen icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Standard browser favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!--
      Link previews (WhatsApp, Telegram, Facebook, LinkedIn, iMessage).

      IMPORTANT: og:url and og:image must be FULL https:// URLs — crawlers
      ignore relative paths like "/og-image.png". Replace YOUR-DOMAIN.com
      with your real deployed domain (3 places: og:url, og:image,
      twitter:image).

      These crawlers don't run JavaScript, so they only ever see the
      static tags below — document.title changes made by React on
      individual pages never show up in a preview.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DC Department Portal" />
    <meta property="og:title" content="DC Department Portal | Asaba HQ" />
    <meta
      property="og:description"
      content="Manage members, units, attendance, contributions and reports for your department."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:locale" content="en_NG" />

    <!-- 1200x630 PNG/JPG, ideally under 300 KB, publicly reachable -->
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DC Department Portal — Dominion City Asaba HQ"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DC Department Portal | Asaba HQ" />
    <meta
      name="twitter:description"
      content="Manage members, units, attendance, contributions and reports for your department."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DC Portal" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
