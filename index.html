<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#003599" />
    <title>DC Department Portal | Asaba HQ</title>

    <meta
      name="description"
      content="DC Department Portal for managing members, units, attendance, contributions, reports, and department activities."
    />
    <meta
      name="keywords"
      content="Dominion City, DC Department Portal, church department, members, attendance, contributions, units, asaba, delta"
    />
    <meta name="author" content="Dominion City Asaba HQ Media Department" />

    <meta name="robots" content="noindex, nofollow" />

    <!-- Apple/iOS home-screen icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Standard browser favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!--
      Link previews (WhatsApp, Telegram, Facebook, LinkedIn, iMessage).

      IMPORTANT: og:url and og:image must be FULL https:// URLs — crawlers
      ignore relative paths like "/og-image.png". Replace YOUR-DOMAIN.com
      with your real deployed domain (3 places: og:url, og:image,
      twitter:image).

      These crawlers don't run JavaScript, so they only ever see the
      static tags below — document.title changes made by React on
      individual pages never show up in a preview.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DC Department Portal" />
    <meta property="og:title" content="DC Department Portal | Asaba HQ" />
    <meta
      property="og:description"
      content="Manage members, units, attendance, contributions and reports for your department."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:locale" content="en_NG" />

    <!-- 1200x630 PNG/JPG, ideally under 300 KB, publicly reachable -->
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DC Department Portal — Dominion City Asaba HQ"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DC Department Portal | Asaba HQ" />
    <meta
      name="twitter:description"
      content="Manage members, units, attendance, contributions and reports for your department."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DC Portal" />

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #ffffff;
        isolation: isolate;
      }

      html.dark #initial-loader {
        background: #030712;
      }

      /* Soft ambient glow behind the logo */
      #initial-loader::before {
        content: '';
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(0, 53, 153, 0.08);
        filter: blur(35px);
        animation: loaderGlow 2.2s ease-in-out infinite;
      }

      html.dark #initial-loader::before {
        background: rgba(0, 53, 153, 0.18);
      }

      .loader-heart {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: heartBeat 1.4s ease-in-out infinite;
      }

      .loader-heart img {
        width: 62px;
        height: 62px;
        object-fit: contain;
        position: relative;
        z-index: 3;
        filter: drop-shadow(0 8px 20px rgba(0, 53, 153, 0.18));
      }

      /* Main pulse ring */
      .loader-heart::before,
      .loader-heart::after {
        content: '';
        position: absolute;
        width: 115px;
        height: 115px;
        border-radius: 50%;
        border: 1px solid rgba(0, 53, 153, 0.18);
        animation: pulseRing 2s ease-out infinite;
      }

      .loader-heart::after {
        animation-delay: 0.7s;
      }

      html.dark .loader-heart::before,
      html.dark .loader-heart::after {
        border-color: rgba(120, 160, 255, 0.18);
      }

      @keyframes heartBeat {
        0%,
        100% {
          transform: scale(1);
        }

        10% {
          transform: scale(1.08);
        }

        20% {
          transform: scale(1);
        }

        30% {
          transform: scale(1.05);
        }

        40% {
          transform: scale(1);
        }
      }

      @keyframes pulseRing {
        0% {
          transform: scale(0.65);
          opacity: 0;
        }

        15% {
          opacity: 0.8;
        }

        70% {
          transform: scale(1.65);
          opacity: 0;
        }

        100% {
          transform: scale(1.65);
          opacity: 0;
        }
      }

      @keyframes loaderGlow {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.5;
        }

        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-heart,
        .loader-heart::before,
        .loader-heart::after,
        #initial-loader::before {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('cdp_theme');

        const isDark =
          savedTheme === 'dark' ||
          (!savedTheme &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);

        if (isDark) {
          document.documentElement.classList.add('dark');
        }

        document.documentElement.dataset.loaderTheme = isDark
          ? 'dark'
          : 'light';
      })();
    </script>
    <div id="initial-loader">
      <div class="loader-heart">
        <img src="/pwa-512x512.png" alt="Loading" />
      </div>
    </div>

    <div id="root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
